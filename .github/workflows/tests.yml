name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor (config.py reads TOML with tomllib); 3.13 is what the suite was written on.
        python-version: ["3.11", "3.13"]
    env:
      # No keys, no real data: the suite uses a fake LLM and stand-in models.
      ASK_SHORTY_NO_DOTENV: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install CPU-only torch, then the project
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r requirements-dev.txt

      - name: Cache Chroma's default ONNX model
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-onnx-${{ runner.os }}-v1

      - name: Run tests
        run: python -m pytest
